name: ci
on:
  push: { branches: [main] }
  pull_request:
# Least-privilege GITHUB_TOKEN: both jobs only checkout + build/test, so read-only
# access to repo contents is all they need (closes CodeQL actions/missing-workflow-
# permissions #1/#2).
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - run: CGO_ENABLED=0 go build ./...
      - run: CGO_ENABLED=0 go test ./...
      - run: go vet ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix web test
